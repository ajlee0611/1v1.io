# fly.toml app configuration file generated for 1v1-io on 2026-10-12T17:25:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '1v1-io'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
